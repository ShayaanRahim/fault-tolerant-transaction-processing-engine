services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 15
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db:5432/ledger
      REDIS_URL: redis://redis:6379
    volumes:
      - ./app:/code/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    


